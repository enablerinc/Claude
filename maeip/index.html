<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F5F4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="매입 등록">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F5F4E'/%3E%3Ctext x='32' y='43' font-family='sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3E매%3C/text%3E%3C/svg%3E">
<title>매입 등록</title>
<style>
  :root{
    --paper:#F2F4F3;
    --surface:#FFFFFF;
    --ink:#14201C;
    --muted:#6E7B77;
    --line:#D3DAD7;
    --pine:#1F5F4E;
    --pine-soft:#E6EFEB;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono","Roboto Mono","D2Coding",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding:20px 14px 120px;
  }
  .wrap{max-width:560px;margin:0 auto}

  header{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:12px;margin-bottom:18px;
    border-bottom:2px solid var(--ink);
  }
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
  header .tag{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    letter-spacing:.08em;margin-left:auto;
  }

  .field{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 13px;
    margin-bottom:9px;
  }
  .label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.09em;
    color:var(--muted);
    margin-bottom:8px;
  }
  .label .req{color:var(--pine)}

  input[type=text],input[type=date],input[type=number],textarea{
    width:100%;
    font-family:var(--sans);
    font-size:16px;
    color:var(--ink);
    background:transparent;
    border:0;
    border-bottom:1.5px solid var(--line);
    border-radius:0;
    padding:4px 0 6px;
    outline:none;
  }
  input:focus,textarea:focus{border-bottom-color:var(--pine)}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--pine);outline-offset:3px}
  textarea{resize:vertical;min-height:64px;line-height:1.55}
  input::placeholder,textarea::placeholder{color:#A9B4B0}
  #amount{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .amount-row{display:flex;align-items:baseline;gap:8px}
  .amount-row .won{font-size:14px;color:var(--muted);flex:none}
  .hangul{
    font-size:12px;color:var(--muted);margin-top:6px;min-height:17px;
  }

  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    transition:background .12s ease,border-color .12s ease;
  }
  .pill:hover{border-color:var(--pine)}
  .pill:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .pill[aria-pressed="true"]{
    background:var(--pine);
    border-color:var(--pine);
    color:#fff;
    font-weight:600;
  }

  .filename{
    position:sticky;bottom:0;
    margin-top:18px;
    background:var(--ink);
    color:#E9EFEC;
    border-radius:10px;
    padding:11px 13px;
  }
  .filename .cap{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    color:#8FA39B;display:block;margin-bottom:5px;
  }
  .filename code{
    font-family:var(--mono);font-size:13px;word-break:break-all;color:#fff;
  }

  .actions{display:flex;gap:8px;margin-top:12px}
  button.go{
    flex:1;
    font-family:var(--sans);font-size:16px;font-weight:600;
    color:#fff;background:var(--pine);
    border:0;border-radius:10px;padding:14px;
    cursor:pointer;
  }
  button.go:hover{background:#17493C}
  button.go:disabled{background:#A9B4B0;cursor:not-allowed}
  button.ghost{
    flex:none;
    font-family:var(--sans);font-size:15px;
    color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    cursor:pointer;
  }
  button.ghost:hover{color:var(--ink);border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

  .out{
    margin-top:12px;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:11px 13px;
  }
  .out .cap{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    color:var(--muted);display:block;margin-bottom:6px;
  }
  #line{
    width:100%;border:0;background:transparent;resize:vertical;
    font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--ink);
    min-height:72px;padding:0;
  }
  .folder{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin-top:10px;
    font-family:var(--sans);font-size:15px;font-weight:600;
    color:var(--pine);text-decoration:none;
    background:var(--pine-soft);
    border:1px solid var(--pine);border-radius:10px;
    padding:13px;
  }
  .folder:hover{background:#D9E7E1}
  .folder:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
  .folder::before{content:"📁";font-size:15px}
  .note{
    font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.65;
  }
  .note a{color:var(--pine)}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:14px;
    padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;
    z-index:10;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>매입 등록</h1>
    <span class="tag">ENABLER</span>
  </header>

  <div class="field">
    <label class="label" for="title">제목 <span class="req">*</span></label>
    <input type="text" id="title" placeholder="예: 제이디" autocomplete="off">
  </div>

  <div class="field">
    <label class="label" for="date">작성일 <span class="req">*</span></label>
    <input type="date" id="date">
  </div>

  <div class="field">
    <span class="label">구분 <span class="req">*</span></span>
    <div class="pills" data-name="구분" data-multi="false">
      <button type="button" class="pill" aria-pressed="false">구매자재</button>
      <button type="button" class="pill" aria-pressed="false">운영경비</button>
    </div>
  </div>

  <div class="field">
    <span class="label">유형 <span class="req">*</span></span>
    <div class="pills" data-name="유형" data-multi="false">
      <button type="button" class="pill" aria-pressed="false">물품</button>
      <button type="button" class="pill" aria-pressed="false">고정</button>
      <button type="button" class="pill" aria-pressed="false">일시</button>
    </div>
  </div>

  <div class="field">
    <span class="label">항목 <span class="req">*</span></span>
    <div class="pills" data-name="항목" data-multi="false">
      <button type="button" class="pill" aria-pressed="false">주변장치</button>
      <button type="button" class="pill" aria-pressed="false">소프트웨어</button>
      <button type="button" class="pill" aria-pressed="false">사무용품</button>
      <button type="button" class="pill" aria-pressed="false">주유비</button>
      <button type="button" class="pill" aria-pressed="false">주거비</button>
      <button type="button" class="pill" aria-pressed="false">식비</button>
      <button type="button" class="pill" aria-pressed="false">차량</button>
      <button type="button" class="pill" aria-pressed="false">기타</button>
    </div>
  </div>

  <div class="field">
    <span class="label">방식 <span class="req">*</span></span>
    <div class="pills" data-name="방식" data-multi="false">
      <button type="button" class="pill" aria-pressed="false">현금</button>
      <button type="button" class="pill" aria-pressed="false">카드</button>
    </div>
  </div>

  <div class="field">
    <label class="label" for="amount">금액 <span class="req">*</span></label>
    <div class="amount-row">
      <input type="number" id="amount" placeholder="0" inputmode="numeric" min="0" step="1">
      <span class="won">원</span>
    </div>
    <div class="hangul" id="hangul"></div>
  </div>

  <div class="field">
    <label class="label" for="body">내용</label>
    <textarea id="body" placeholder="1. 두산 로봇 잔금&#10;2. 8월28일까지 송금 필요"></textarea>
  </div>

  <div class="field">
    <span class="label">작성자 <span class="req">*</span></span>
    <div class="pills" data-name="작성자" data-multi="true">
      <button type="button" class="pill" aria-pressed="false">양희종</button>
      <button type="button" class="pill" aria-pressed="false">박병철</button>
      <button type="button" class="pill" aria-pressed="false">손대웅</button>
      <button type="button" class="pill" aria-pressed="false">강유현</button>
      <button type="button" class="pill" aria-pressed="false">임재훈</button>
    </div>
  </div>

  <div class="filename">
    <span class="cap">영수증 파일명</span>
    <code id="fname">—</code>
  </div>

  <div class="actions">
    <button type="button" class="go" id="copy">복사하기</button>
    <button type="button" class="ghost" id="reset">초기화</button>
  </div>

  <div class="out">
    <span class="cap">붙여넣을 내용</span>
    <textarea id="line" readonly></textarea>
  </div>

  <a class="folder" href="https://enablerai.sharepoint.com/:f:/s/msteams_6af320/IgC9qm8cEHuEQrpkXr-toOC_AZ8Yyy4_OBzglEzPURbE5iY" target="_blank" rel="noopener">
    영수증 폴더 열기
  </a>

  <p class="note">
    복사한 내용을 대화창에 붙여넣으면 노션 매입 DB에 등록됩니다.
    이름이 바뀐 영수증 파일을 받아 위 폴더에 올리면 끝입니다.
  </p>

</div>

<div class="toast" id="toast">복사됨</div>

<script>
(function(){
  var el = function(id){ return document.getElementById(id); };
  var pick = {};

  // 오늘 날짜 기본값
  var t = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  el('date').value = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());

  // 알약 선택
  Array.prototype.forEach.call(document.querySelectorAll('.pills'), function(group){
    var name = group.getAttribute('data-name');
    var multi = group.getAttribute('data-multi') === 'true';
    pick[name] = [];
    Array.prototype.forEach.call(group.querySelectorAll('.pill'), function(btn){
      btn.addEventListener('click', function(){
        var on = btn.getAttribute('aria-pressed') === 'true';
        if(!multi){
          Array.prototype.forEach.call(group.querySelectorAll('.pill'), function(b){
            b.setAttribute('aria-pressed','false');
          });
          pick[name] = on ? [] : [btn.textContent];
          btn.setAttribute('aria-pressed', on ? 'false' : 'true');
        } else {
          btn.setAttribute('aria-pressed', on ? 'false' : 'true');
          if(on){
            pick[name] = pick[name].filter(function(v){ return v !== btn.textContent; });
          } else {
            pick[name].push(btn.textContent);
          }
        }
        render();
      });
    });
  });

  // 한글 금액
  var units = ['','만','억','조'];
  function toHangul(n){
    if(!n) return '';
    var s = String(n), out = [], i = 0;
    while(s.length > 0){
      var chunk = s.slice(Math.max(0, s.length-4));
      s = s.slice(0, Math.max(0, s.length-4));
      if(parseInt(chunk,10) !== 0){
        out.unshift(parseInt(chunk,10).toLocaleString('ko-KR') + units[i]);
      }
      i++;
      if(i > 3) break;
    }
    return out.join(' ') + '원';
  }

  function render(){
    var title = el('title').value.trim();
    var date = el('date').value;
    var amount = el('amount').value.replace(/[^0-9]/g,'');
    var body = el('body').value.trim();

    el('hangul').textContent = amount ? toHangul(parseInt(amount,10)) : '';

    // 파일명 미리보기: YYMMDD_제목_금액
    if(title && date && amount){
      el('fname').textContent = date.slice(2).replace(/-/g,'') + '_' + title + '_' + amount + '.<확장자>';
    } else {
      el('fname').textContent = '—';
    }

    var parts = [];
    if(pick['구분'].length) parts.push('구분: ' + pick['구분'][0]);
    if(pick['유형'].length) parts.push('유형: ' + pick['유형'][0]);
    if(pick['항목'].length) parts.push('항목: ' + pick['항목'][0]);
    if(pick['방식'].length) parts.push('방식: ' + pick['방식'][0]);
    if(pick['작성자'].length) parts.push('작성자: ' + pick['작성자'].join(', '));
    if(title) parts.push('제목: ' + title);
    if(date) parts.push('작성일: ' + date);
    if(amount) parts.push('금액: ' + amount);
    if(body) parts.push('내용: ' + body.replace(/\n+/g,' / '));

    var line = parts.length ? '매입 등록 — ' + parts.join(' · ') : '';
    el('line').value = line;

    var ready = title && date && amount && pick['구분'].length && pick['유형'].length
      && pick['항목'].length && pick['방식'].length && pick['작성자'].length;
    el('copy').disabled = !ready;
    el('copy').textContent = ready ? '복사하기' : '항목을 모두 채워주세요';
  }

  ['title','date','amount','body'].forEach(function(id){
    el(id).addEventListener('input', render);
  });

  function toast(msg){
    var tt = el('toast');
    tt.textContent = msg;
    tt.classList.add('on');
    setTimeout(function(){ tt.classList.remove('on'); }, 1600);
  }

  el('copy').addEventListener('click', function(){
    var box = el('line');
    box.removeAttribute('readonly');
    box.select();
    box.setSelectionRange(0, 99999);
    var done = false;
    try { done = document.execCommand('copy'); } catch(e){ done = false; }
    box.setAttribute('readonly','readonly');
    if(!done && navigator.clipboard){
      navigator.clipboard.writeText(box.value).then(function(){ toast('복사됨'); },
        function(){ toast('아래 내용을 직접 선택해 복사하세요'); });
      return;
    }
    toast(done ? '복사됨' : '아래 내용을 직접 선택해 복사하세요');
  });

  el('reset').addEventListener('click', function(){
    el('title').value = '';
    el('amount').value = '';
    el('body').value = '';
    el('date').value = t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
    Array.prototype.forEach.call(document.querySelectorAll('.pill'), function(b){
      b.setAttribute('aria-pressed','false');
    });
    Object.keys(pick).forEach(function(k){ pick[k] = []; });
    render();
    el('title').focus();
  });

  render();
})();
</script>
</body>
</html>
